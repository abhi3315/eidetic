[workspace]
resolver = "2"
members = [
    "crates/eidetic-cli",
    "crates/eidetic-core",
    "crates/eidetic-db",
    "crates/eidetic-ingest",
    "crates/eidetic-ml",
    "crates/eidetic-server",
]

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
authors = ["Abhishek Sharma"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ONNX Runtime (ML inference, downloads prebuilt native library at build time)
ort = { version = "2.0.0-rc.12", features = ["download-binaries", "ndarray"] }

# HuggingFace Hub (model file download)
hf-hub = "0.5"

# Image loading and resizing
image = "0.25"

# HEIC/HEIF decoding (registers as a decoder hook on the `image` crate)
libheif-rs = { version = "2.2", default-features = false, features = ["image", "v1_17"] }

# N-dimensional arrays for tensor construction
ndarray = "0.17"

# Text tokenization (HuggingFace tokenizers port)
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }

# pgvector sqlx type integration
pgvector = { version = "0.4", features = ["sqlx"] }

# Errors
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# HTTP server
axum = "0.8"
maud = "0.27"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Hashing
sha2 = "0.11"

# MIME detection
infer = "0.19"

# EXIF parsing (Rust module name: exif)
kamadak-exif = "0.6"

# Directory walking
walkdir = "2"

# CSV parsing (for COCO eval)
csv = "1"

# Testing
testcontainers = { version = "0.27" }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
