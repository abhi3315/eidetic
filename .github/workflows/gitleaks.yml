name: gitleaks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"  # weekly Monday 04:00 UTC, catches secrets in older history

permissions:
  contents: read
  pull-requests: write  # needed for GITLEAKS_ENABLE_COMMENTS to post findings on the PR

jobs:
  scan:
    name: scan for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0  # gitleaks needs full history to scan past commits

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE not required for personal accounts (only paid for org private repos)
          GITLEAKS_ENABLE_COMMENTS: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"
