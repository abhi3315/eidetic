name: Release

# Builds one self-contained archive per platform (ADR-0009) and attaches them
# to the GitHub release for the pushed tag.
#
# ONNX Runtime is statically linked into the binary by ort's `download-binaries`
# feature, so an archive is just the executable plus docs — there is no
# libonnxruntime to ship alongside it.
#
# Hand-written rather than generated by cargo-dist: the matrix is small enough
# to read at a glance, and it needs per-target feature differences (HEIC on
# Linux/macOS, off on Windows) that are awkward to express in dist's config.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for a dry run)"
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            # glibc, not musl: ort's prebuilt ONNX Runtime is glibc-based.
            features: ""
            heic: true
          - name: linux-x86_64-cuda
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: "--features cuda"
            heic: true
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            features: ""
            heic: true
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            # No HEIC: libheif on MSVC needs a vcpkg build chain. The feature
            # gate from ADR-0008 is exactly what makes this build possible.
            features: "--no-default-features"
            heic: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: 1.92.0
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          key: ${{ matrix.name }}

      - name: Install libheif (Linux)
        if: matrix.heic && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libheif-dev libheif-plugin-x265 libheif-plugin-libde265

      - name: Install libheif (macOS)
        if: matrix.heic && runner.os == 'macOS'
        run: brew install libheif

      - name: Build
        run: cargo build --release --locked -p eidetic-cli --target ${{ matrix.target }} ${{ matrix.features }}

      - name: Stage archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          STAGE="eidetic-${{ matrix.name }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/eidetic" "$STAGE/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$STAGE/"
          # Record what this build can actually do, so a downloaded archive is
          # self-describing rather than guesswork.
          {
            echo "eidetic ${{ github.ref_name }} — ${{ matrix.name }}"
            echo "HEIC support: ${{ matrix.heic }}"
            echo "cargo flags: ${{ matrix.features }}"
            if [ -n "${{ matrix.features }}" ] && [ "${{ matrix.features }}" = "--features cuda" ]; then
              echo ""
              echo "This build needs an ONNX Runtime >= 1.27 CUDA build at runtime."
              echo "Point ORT_DYLIB_PATH at its libonnxruntime.so and set"
              echo "EIDETIC_ACCELERATOR=cuda. Requires CUDA 13 + cuDNN 9 on the host."
              echo "See docs/adr/0006-gpu-execution-provider.md"
            fi
          } > "$STAGE/BUILD-INFO.txt"
          tar czf "$STAGE.tar.gz" "$STAGE"
          shasum -a 256 "$STAGE.tar.gz" > "$STAGE.tar.gz.sha256"

      - name: Stage archive (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          STAGE="eidetic-${{ matrix.name }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/eidetic.exe" "$STAGE/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$STAGE/"
          {
            echo "eidetic ${{ github.ref_name }} — ${{ matrix.name }}"
            echo "HEIC support: false (built --no-default-features)"
          } > "$STAGE/BUILD-INFO.txt"
          7z a "$STAGE.zip" "$STAGE" > /dev/null
          certutil -hashfile "$STAGE.zip" SHA256 > "$STAGE.zip.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: eidetic-${{ matrix.name }}
          path: |
            eidetic-*.tar.gz*
            eidetic-*.zip*
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8  # v2
        with:
          files: dist/*
          generate_release_notes: true
