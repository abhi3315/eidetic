version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust
    groups:
      patch-and-minor:
        update-types:
          - patch
          - minor
      ort-stack:
        patterns:
          - "ort"
          - "ort-sys"
          - "ndarray"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    groups:
      actions:
        update-types:
          - patch
          - minor
          - major
