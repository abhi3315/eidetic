# cargo-deny configuration.
#
# ML projects pull binary blobs and many transitive dependencies; license
# and advisory checks are cheap insurance. Run locally with:
#   cargo deny check
# CI runs the same check via .github/workflows/ci.yml.

[graph]
all-features = false
no-default-features = false

[advisories]
yanked = "warn"
ignore = [
    # number_prefix is unmaintained — pulled in via hf-hub → indicatif. No safe upgrade.
    "RUSTSEC-2025-0119",
    # paste is unmaintained — pulled in via tokenizers and image → ravif → rav1e. No safe upgrade.
    "RUSTSEC-2024-0436",
    # rustls-pemfile is unmaintained — pulled in via testcontainers → bollard. No safe upgrade.
    "RUSTSEC-2025-0134",
    # tokio-tar PAX parsing bug — pulled in via testcontainers. No safe upgrade.
    "RUSTSEC-2025-0111",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "0BSD",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = [
    # libfuzzer-sys (NCSA) is a transitive dep via image → ravif → rav1e → libfuzzer-sys.
    { allow = ["NCSA"], name = "libfuzzer-sys" },
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
