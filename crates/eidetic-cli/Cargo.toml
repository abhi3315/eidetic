[package]
name = "eidetic-cli"
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Eidetic command-line interface."

[[bin]]
name = "eidetic"
path = "src/main.rs"

[features]
default = ["heic"]
# HEIC via libheif (ADR-0008). Drop with --no-default-features for a build
# with no C system dependency.
heic = ["eidetic-ingest/heic", "eidetic-ml/heic", "eidetic-server/heic"]
# NVIDIA GPU acceleration (ADR-0006). Needs an ONNX Runtime >= 1.27 CUDA
# build at runtime via ORT_DYLIB_PATH.
cuda = ["eidetic-ml/cuda", "eidetic-server/cuda"]
# Speech transcription + spoken-word search (whisper.cpp via cmake).
speech = ["eidetic-ml/speech"]
speech-cuda = ["eidetic-ml/speech-cuda"]

[dependencies]
eidetic-core = { path = "../eidetic-core" }
# default-features = false on the crates that own optional native deps, so
# --no-default-features on the binary propagates all the way down.
eidetic-ingest = { path = "../eidetic-ingest", default-features = false }
eidetic-db = { path = "../eidetic-db" }
eidetic-ml = { path = "../eidetic-ml", default-features = false }
eidetic-server = { path = "../eidetic-server", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
csv = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
