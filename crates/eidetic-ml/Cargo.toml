[package]
name = "eidetic-ml"
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "ML inference for Eidetic: image and face embeddings via ONNX."

[features]
default = ["heic"]
# HEIC/HEIF decoding via libheif — see eidetic-ingest for the rationale
# (ADR-0008). --no-default-features drops the C dependency.
heic = ["dep:libheif-rs"]
# NVIDIA GPU acceleration via ONNX Runtime's CUDA execution provider (non-macOS).
# Requires an ONNX Runtime >= 1.27 CUDA build supplied at runtime via
# `ORT_DYLIB_PATH` (load-dynamic linking), plus CUDA 13 runtime + cuDNN 9 on the
# host. The bundled ORT (download-binaries) is 1.23.x and lacks Blackwell/sm_120
# kernels. See docs/adr/0006-gpu-execution-provider.md.
cuda = ["ort/cuda", "ort/load-dynamic"]
# Speech transcription via whisper.cpp. Off by default: whisper-rs-sys
# compiles C with cmake, which would break the no-native-deps guarantee of
# default builds (ADR-0009).
speech = ["dep:whisper-rs"]
# GPU speech decode: whisper.cpp compiled with CUDA kernels. Needs the CUDA
# toolkit (nvcc) at build time on top of the speech feature's cmake.
speech-cuda = ["speech", "whisper-rs/cuda"]

[dependencies]
eidetic-core = { path = "../eidetic-core" }
thiserror = { workspace = true }
tracing = { workspace = true }
ort = { workspace = true }
whisper-rs = { workspace = true, optional = true }
hf-hub = { workspace = true }
image = { workspace = true }
libheif-rs = { workspace = true, optional = true }
ndarray = { workspace = true }
tokenizers = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { workspace = true, features = ["coreml"] }

[dev-dependencies]
tempfile = { workspace = true }
