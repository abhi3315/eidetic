[package]
name = "eidetic-server"
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Axum HTTP server for Eidetic."

[features]
default = ["heic"]
heic = ["eidetic-ml/heic", "eidetic-ingest/heic"]
cuda = ["eidetic-ml/cuda"]

[dependencies]
eidetic-core = { path = "../eidetic-core" }
eidetic-db = { path = "../eidetic-db" }
# default-features = false so --no-default-features here actually reaches
# eidetic-ml's libheif dependency instead of being silently re-enabled.
eidetic-ml = { path = "../eidetic-ml", default-features = false }
eidetic-ingest = { path = "../eidetic-ingest", default-features = false }
anyhow = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
image = { workspace = true }
maud = { workspace = true }
mime = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
http-body-util = "0.1"
tower = { workspace = true }
tempfile = { workspace = true }
