[package]
name = "eidetic-db"
version = "0.8.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Database access layer for Eidetic."

[dependencies]
eidetic-core = { path = "../eidetic-core" }
sqlx = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# default-features = false: these tests don't need HEIC, and leaving the
# default on would re-enable eidetic-ingest/heic for the whole workspace
# through feature unification, defeating --no-default-features builds.
eidetic-ingest = { path = "../eidetic-ingest", default-features = false }
image = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
walkdir = { workspace = true }
